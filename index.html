        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does Megabyte PDF work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Type a prompt — \"create a two-page invoice for $4,500 of consulting work\" — and the AI writes the HTML and CSS for a print-ready 8.5 × 11 document. You see every page render in real time. Hit Download to get a real PDF."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need an account to try it?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Guest mode gives you 10 AI prompts per day with live preview in your browser. Sign up (free) to save projects and build on them across sessions."
            }
          },
          {
            "@type": "Question",
            "name": "Can I download a real PDF?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — Pro users ($9/mo) get true PDF exports generated by Cloudflare Browser Rendering. The file has selectable text, embedded fonts, and correct page dimensions. Guest and Free tiers see the live preview only."
            }
          },
          {
            "@type": "Question",
            "name": "What kinds of documents can Megabyte PDF make?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Invoices, resumes, reports, contracts, proposals, cover letters, technical specs — anything that maps to a printed page. If you can describe it in plain English, Megabyte PDF can draft it."
            }
          },
          {
            "@type": "Question",
            "name": "Can I share a document with a client?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pro users get a public share link. Recipients see a read-only preview of your document — no account required on their end."
            }
          },
          {
            "@type": "Question",
            "name": "How do version snapshots work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every AI response creates a snapshot. You can restore any previous version of your document with one click — handy when a prompt takes the design in the wrong direction."
            }
          }
        ]
      }
    </script>
