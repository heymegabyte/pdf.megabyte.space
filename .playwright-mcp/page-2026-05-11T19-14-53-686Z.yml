        - heading "Common questions." [level=2] [ref=e425]
        - generic [ref=e426]:
          - generic [ref=e427]:
            - term [ref=e428]:
              - button "How does Megabyte PDF work?" [ref=e429]:
                - generic [ref=e430]: How does Megabyte PDF work?
                - img [ref=e431]
            - paragraph [ref=e433]: Type a prompt — "create a two-page invoice for $4,500 of consulting work" — and the AI writes the HTML and CSS for a print-ready 8.5 × 11 document. You see every page render in real time. Hit Download to get a real PDF.
          - generic [ref=e434]:
            - term [ref=e435]:
              - button "Do I need an account to try it?" [ref=e436]:
                - generic [ref=e437]: Do I need an account to try it?
                - img [ref=e438]
            - paragraph [ref=e440]: No. Guest mode gives you 10 AI prompts per day with live preview in your browser. Sign up (free) to save projects and build on them across sessions.
          - generic [ref=e441]:
            - term [ref=e442]:
              - button "Can I download a real PDF?" [ref=e443]:
                - generic [ref=e444]: Can I download a real PDF?
                - img [ref=e445]
            - paragraph [ref=e447]: Yes — Pro users ($9/mo) get true PDF exports generated by Cloudflare Browser Rendering. The file has selectable text, embedded fonts, and correct page dimensions. Guest and Free tiers see the live preview only.
          - generic [ref=e448]:
            - term [ref=e449]:
              - button "What kinds of documents can it make?" [ref=e450]:
                - generic [ref=e451]: What kinds of documents can it make?
                - img [ref=e452]
            - paragraph [ref=e454]: Invoices, resumes, reports, contracts, proposals, cover letters, technical specs — anything that maps to a printed page. If you can describe it in plain English, Megabyte PDF can draft it.
          - generic [ref=e455]:
            - term [ref=e456]:
              - button "Can I share a document with a client?" [ref=e457]:
                - generic [ref=e458]: Can I share a document with a client?
                - img [ref=e459]
            - paragraph [ref=e461]: Pro users get a public share link. Recipients see a read-only preview of your document — no account required on their end.
          - generic [ref=e462]:
            - term [ref=e463]:
              - button "How do version snapshots work?" [ref=e464]:
                - generic [ref=e465]: How do version snapshots work?
                - img [ref=e466]
            - paragraph [ref=e468]: Every AI response creates a snapshot. You can restore any previous version of your document with one click — handy when a prompt takes the design in the wrong direction.
